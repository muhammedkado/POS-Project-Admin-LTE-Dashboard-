# /etc/nginx/sites-available/pos.mkado.dev
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.mkado.dev;

    root /var/www/pos/public;
    index index.php;

    ssl_certificate     /etc/ssl/cloudflare/mkado.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mkado.dev.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 5m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/pos.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pos.mkado.dev;
    return 301 https://$host$request_uri;
}
